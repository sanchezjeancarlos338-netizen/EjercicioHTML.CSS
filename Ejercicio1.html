<!DOCTYPE html>
<!-- Indica que el documento utiliza HTML5 -->

<html>
<!-- Etiqueta principal que contiene todo el documento HTML -->

<head>
    <!-- Contiene información sobre la página que no se muestra directamente -->

    <title>Mi guía de HTML</title>
    <!-- Define el título que aparece en la pestaña del navegador -->

</head>

<body>
    <!-- Contiene todo el contenido visible de la página -->

    <h1>Jean Carlos Sanchez</h1>
    <!-- h1 crea el título principal de la página -->

</body>

</html>
<!-- Indica el final del documento HTML -->
