<body>
    <!-- <body> contiene todo el contenido visible de la página -->

    <table border="1">
        <!-- <table> crea una tabla -->
        <!-- border="1" agrega un borde visible a la tabla -->

        <tr>
            <!-- <tr> crea una fila de la tabla -->

            <th>Producto</th>
            <!-- <th> crea un encabezado de columna -->

            <th>Precio</th>
            <!-- Segundo encabezado de columna -->

        </tr>

        <tr>
            <!-- Primera fila de datos -->

            <td>Cuaderno</td>
            <!-- <td> contiene un dato de la tabla -->

            <td>$5000</td>
            <!-- Precio del cuaderno -->

        </tr>

        <tr>
            <!-- Segunda fila de datos -->

            <td>Lápiz</td>
            <!-- Producto inventado -->

            <td>$1000</td>
            <!-- Precio del lápiz -->

        </tr>

    </table>
    <!-- Fin de la tabla -->

</body>
<!-- Fin del contenido visible de la página -->
