<body>
    <!-- <body> contiene todo el contenido visible de la página -->

    <form>
        <!-- <form> crea un formulario para ingresar información -->

        <label for="nombre">Nombre:</label>
        <!-- <label> crea el texto que identifica el campo -->
        <!-- for="nombre" lo relaciona con el input que tiene id="nombre" -->

        <input type="text" id="nombre">
        <!-- <input type="text"> permite escribir texto, en este caso el nombre -->

        <br>
        <!-- <br> hace un salto de línea -->

        <label for="correo">Correo:</label>
        <!-- Etiqueta que identifica el campo del correo -->

        <input type="email" id="correo">
        <!-- type="email" crea un campo para escribir un correo electrónico -->

        <br>

        <label for="msg">Mensaje:</label>
        <!-- Etiqueta que identifica el campo del mensaje -->

        <br>

        <textarea id="msg"></textarea>
        <!-- <textarea> crea un espacio grande para escribir un mensaje -->

        <br>

        <button type="submit">Enviar</button>
        <!-- <button> crea un botón -->
        <!-- type="submit" indica que el botón sirve para enviar el formulario -->

    </form>
    <!-- Fin del formulario -->

</body>
<!-- Fin del contenido visible de la página -->
