<!DOCTYPE html>
<html>

<head>
    <title>Mi Blog de Tecnología</title>
    <!-- <title> define el nombre que aparece en la pestaña del navegador -->
</head>

<body>

    <header>
        <!-- <header> representa la parte superior de la página -->

        <h1>Mi Blog de Tecnología</h1>
        <!-- <h1> muestra el título principal -->

        <nav>
            <!-- <nav> contiene los enlaces de navegación de la página -->

            <a href="#">Inicio</a>
            <a href="#">Tecnología</a>
            <a href="#">Contacto</a>

        </nav>
    </header>

    <main>
        <!-- <main> contiene el contenido principal de la página -->

        <article>
            <!-- <article> contiene un contenido independiente, como una publicación -->

            <h2>La importancia de aprender HTML</h2>

            <p>
                HTML es un lenguaje fundamental para crear páginas web.
                Aprender sus etiquetas permite construir sitios organizados
                y fáciles de navegar.
            </p>

        </article>

    </main>

    <footer>
        <!-- <footer> representa la parte inferior de la página -->

        <p>© 2026 Mi Blog de Tecnología</p>

    </footer>

</body>

</html>
