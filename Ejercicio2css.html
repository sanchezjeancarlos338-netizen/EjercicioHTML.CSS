<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Clases e ID</title>

  <style>
    /* La clase destacado tendrá fondo amarillo */
    .destacado {
      background-color: rgb(255, 255, 0);
    }

    /* El elemento con id especial tendrá el texto en negrita */
    #especial {
      font-weight: bold;
    }
  </style>
</head>

<body>

  <ul>
    <li>Primer elemento</li>
    <li class="destacado">Segundo elemento destacado</li>
    <li id="especial">Tercer elemento especial</li>
  </ul>

</body>
</html>
